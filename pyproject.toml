[project]
name = "pymast"
version = "0.1.0"
description = "Pure Python implementation of the MAST R/Bioconductor package for single-cell differential expression"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pyMAST Contributors" }]
requires-python = ">=3.14"
keywords = ["single-cell", "differential-expression", "MAST", "hurdle-model", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=3.0.3",
    "statsmodels>=0.14",
    "anndata==0.12.16",
    "scikit-learn>=1.5",
    "patsy>=0.5",
    "tqdm>=4.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "black"]
jupyter = ["jupyter", "marimo", "matplotlib", "seaborn"]

[project.urls]
Homepage = "https://github.com/<user>/pyMAST"
Repository = "https://github.com/<user>/pyMAST"
Documentation = "https://github.com/<user>/pyMAST#readme"
"Bug Tracker" = "https://github.com/<user>/pyMAST/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pymast"]

[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
